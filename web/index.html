<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>z-image</title>
  <style>
    html { box-sizing: border-box; }
    *, *::before, *::after { box-sizing: inherit; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: #0b0d12;
      color: #e8eaef;
      font-size: clamp(0.72rem, 0.55rem + 0.9vmin, 1rem);
      line-height: 1.35;
      overflow: hidden;
    }

    body.portrait {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .shell {
      height: 100dvh;
      display: flex;
      flex-direction: row;
      gap: 0.75em;
      padding: 0.75em;
    }

    body.portrait .shell {
      height: auto;
      flex-direction: column;
      gap: 0;
      padding: 0;
    }

    .panel {
      background: rgba(18, 22, 32, 0.92);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 1em;
      min-height: 0;
    }

    .form-panel {
      width: clamp(14em, 32vw, 24em);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      padding: 0.9em 1em;
      overflow: hidden;
      container-type: size;
      container-name: form;
    }

    body.portrait .form-panel {
      width: 100%;
      flex: 0 0 100dvh;
      height: 100dvh;
      border-radius: 0;
      border-left: 0;
      border-right: 0;
    }

    .gallery-panel {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      container-type: size;
      container-name: gallery;
    }

    body.portrait .gallery-panel {
      flex: 0 0 100dvh;
      height: 100dvh;
      border-radius: 0;
    }

    .title { font-size: 1.35em; font-weight: 600; letter-spacing: -0.02em; }
    .subtitle { font-size: 0.78em; color: rgba(255,255,255,0.45); margin-top: 0.2em; }
    .field-label {
      display: block;
      font-size: 0.72em;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.45);
      margin-bottom: 0.25em;
    }

    #gen-form {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: minmax(0, 1fr) repeat(5, auto);
      gap: 0.65em;
      margin-top: 0.65em;
      overflow: hidden;
      align-content: start;
    }

    .field { display: block; min-width: 0; }
    .hidden { display: none !important; }

    .field-prompt {
      grid-column: 1 / -1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .field-width { grid-column: 1; }
    .field-height { grid-column: 2; }
    .field-count { grid-column: 1; }
    .field-seed { grid-column: 2; }
    .field-upload { grid-column: 1 / -1; }

    .gen-actions {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55em;
    }

    #gen-form input:not([type="file"]),
    #gen-form textarea,
    #gen-form select {
      display: block;
      width: 100%;
      margin: 0;
      background: #0f131c;
      border: 1px solid rgba(255,255,255,0.08);
      color: #e8eaef;
      border-radius: 0.45em;
      font: inherit;
      line-height: 1.45;
      padding: 0.7em 0.9em;
    }

    #gen-form textarea {
      flex: 1 1 auto;
      min-height: 3.5em;
      resize: none;
    }

    @container form (min-height: 0) {
      .title { font-size: clamp(0.9rem, 4.5cqh, 1.35rem); }
      .subtitle { font-size: clamp(0.65rem, 2.8cqh, 0.78rem); }
      .field-label { font-size: clamp(0.6rem, 2.5cqh, 0.72rem); }
      #gen-form { gap: clamp(0.4em, 1.8cqh, 0.65em); }
      #gen-form input:not([type="file"]),
      #gen-form textarea,
      #gen-form select {
        padding: clamp(0.45em, 2cqh, 0.7em) clamp(0.55em, 2.5cqw, 0.9em);
      }
      #gen-form textarea {
        min-height: max(3em, 8cqh);
      }
      .upload-btn { padding: clamp(0.4em, 2cqh, 0.55em) clamp(0.5em, 2cqw, 0.7em); }
      .btn-primary { padding: clamp(0.45em, 2.2cqh, 0.6em) clamp(0.55em, 2.5cqw, 0.8em); }
      #status {
        font-size: clamp(0.65rem, 2.5cqh, 0.78rem);
        height: clamp(1.2em, 2.8cqh, 1.35em);
        line-height: clamp(1.2em, 2.8cqh, 1.35em);
      }
    }

    @container gallery (min-height: 0) {
      .gallery-header {
        padding: clamp(0.45em, 2.5cqh, 0.65em) clamp(0.6em, 3cqw, 1em);
        font-size: clamp(0.8rem, 3.2cqh, 0.92rem);
      }
      #counter { font-size: clamp(0.7rem, 2.8cqh, 0.85rem); }
      .preview-stage { padding: clamp(0.4em, 2.5cqh, 0.75em); }
      .nav-btn {
        width: clamp(1.8em, 9cqh, 2.6em);
        height: clamp(1.8em, 9cqh, 2.6em);
        font-size: clamp(0.9rem, 4cqh, 1.2rem);
      }
      #preview-meta { font-size: clamp(0.65rem, 2.5cqh, 0.78rem); }
      #preview-prompt { font-size: clamp(0.6rem, 2.2cqh, 0.72rem); }
      #empty { font-size: clamp(0.8rem, 3.2cqh, 0.92rem); }
    }

    #gen-form input:focus,
    #gen-form textarea:focus,
    #gen-form select:focus {
      outline: none;
      border-color: rgba(99, 132, 255, 0.55);
      box-shadow: 0 0 0 3px rgba(99, 132, 255, 0.12);
    }

    #gen-form input:not([type="file"]):disabled,
    #gen-form textarea:disabled,
    #gen-form select:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .upload-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.55em 0.7em;
      border-radius: 0.45em;
      border: 1px dashed rgba(255,255,255,0.22);
      background: #121826;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .upload-btn:hover { border-color: rgba(99, 132, 255, 0.5); background: #151d2e; }
    .upload-btn.is-busy { opacity: 0.55; cursor: not-allowed; pointer-events: none; }
    .upload-btn input { display: none; }

    .btn-primary {
      width: 100%;
      border: 0;
      border-radius: 0.65em;
      padding: 0.6em 0.8em;
      font: inherit;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, #4f7cff, #6b5cff);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45em;
      cursor: pointer;
      transition: filter 0.15s;
    }

    .btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; filter: none; }

    .btn-spinner {
      width: 1em;
      height: 1em;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 9999px;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #status {
      grid-column: 1 / -1;
      font-size: 0.78em;
      color: rgba(255,255,255,0.4);
      height: 1.35em;
      line-height: 1.35em;
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #status.is-error { color: #ff8a8a; }

    .gallery-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65em 1em;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.92em;
      color: rgba(255,255,255,0.6);
      flex-shrink: 0;
    }

    #counter { font-size: 0.85em; color: rgba(255,255,255,0.4); font-variant-numeric: tabular-nums; }

    .preview-stage {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 0.75em;
    }

    .preview-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5em;
      min-height: 0;
    }

    #preview {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 0.5em;
      box-shadow: 0 1.2em 2.5em rgba(0,0,0,0.45);
    }

    #empty { font-size: 0.92em; color: rgba(255,255,255,0.35); }
    #preview-meta {
      font-size: 0.78em;
      color: rgba(255,255,255,0.4);
      text-align: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 1.5em;
      margin-bottom: 0.35em;
      flex-shrink: 0;
    }

    #preview-prompt {
      font-size: 0.72em;
      color: rgba(255,255,255,0.5);
      text-align: center;
      max-width: 100%;
      padding: 0 1.5em 0.75em;
      margin: 0;
      line-height: 1.35;
      flex-shrink: 0;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: clamp(2em, 4.5vmin, 2.6em);
      height: clamp(2em, 4.5vmin, 2.6em);
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
      color: #e8eaef;
      font-size: 1.2em;
      line-height: 1;
      cursor: pointer;
      z-index: 2;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    @media (pointer: coarse) {
      .nav-btn {
        width: 3em;
        height: 3em;
        font-size: 1.4em;
      }
    }

    .nav-btn:hover { background: rgba(0,0,0,0.65); }
    #prev-btn { left: 0.6em; }
    #next-btn { right: 0.6em; }

    .scroll-jump-btn {
      position: fixed;
      right: 1em;
      bottom: 1em;
      width: 2.6em;
      height: 2.6em;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(6px);
      color: #e8eaef;
      font-size: 1.2em;
      line-height: 1;
      cursor: pointer;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }

    .scroll-jump-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .scroll-jump-btn:hover { background: rgba(0,0,0,0.75); }

    @media (max-aspect-ratio: 10/11) {
      body:not(.portrait) .shell { flex-direction: column; }
      body:not(.portrait) .form-panel {
        width: 100%;
        flex: 0 0 auto;
        max-height: 44dvh;
      }
      body:not(.portrait) .gallery-panel { flex: 1 1 0; }
    }
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <section class="panel form-panel">
      <div class="form-header">
        <h1 class="title">z-image</h1>
        <p class="subtitle">Generate from the warm worker</p>
      </div>

      <form id="gen-form">
        <label class="field field-prompt">
          <span class="field-label">Prompt</span>
          <textarea id="prompt" required placeholder="Describe the image…"></textarea>
        </label>

        <label class="field field-width">
          <span class="field-label">Width</span>
          <input id="width" type="number" min="256" max="4096" step="16" value="1024">
        </label>

        <label class="field field-height">
          <span class="field-label">Height</span>
          <input id="height" type="number" min="256" max="4096" step="16" value="1024">
        </label>

        <label class="field field-count">
          <span class="field-label">Count</span>
          <input id="count" type="number" min="1" max="50" value="1">
        </label>

        <label class="field field-seed">
          <span class="field-label">Seed</span>
          <input id="seed" type="text" value="random" disabled>
        </label>

        <div class="field field-upload">
          <span class="field-label">From image</span>
          <label id="upload-btn" class="upload-btn">
            <input id="upload" type="file" accept="image/*">
            <span id="upload-label">Choose image…</span>
          </label>
        </div>

        <div class="gen-actions">
          <button type="button" id="preview-btn" class="btn-primary">
            <span class="btn-spinner hidden" aria-hidden="true"></span>
            <span class="btn-text">Preview</span>
          </button>
          <button type="button" id="refine-btn" class="btn-primary" disabled>
            <span class="btn-spinner hidden" aria-hidden="true"></span>
            <span class="btn-text">Refine</span>
          </button>
        </div>

        <p id="status"></p>
      </form>
    </section>

    <section class="panel gallery-panel" id="gallery-panel">
      <div class="gallery-header">
        <span>Gallery</span>
        <span id="counter"></span>
      </div>

      <div class="preview-stage">
        <button type="button" id="prev-btn" class="nav-btn" aria-label="Previous">‹</button>

        <div class="preview-wrap">
          <img id="preview" alt="" class="hidden">
          <p id="empty">No images in gallery yet</p>
          <p id="preview-meta"></p>
          <p id="preview-prompt" class="hidden"></p>
        </div>

        <button type="button" id="next-btn" class="nav-btn" aria-label="Next">›</button>
      </div>
    </section>
  </div>

  <button type="button" id="scroll-jump-btn" class="scroll-jump-btn" aria-label="Scroll down">↓</button>

  <script>
    const $ = (id) => document.getElementById(id);
    let images = [];
    let index = 0;
    let generating = false;
    let genProgress = null;
    let genAbort = false;
    let lastSeed = null;
    let lastGenMode = null;
    let activeGenMode = null;
    let viewerToken = 0;
    const imageCache = new Map();

    const PREVIEW_STEPS = 3;
    const REFINED_STEPS = 8;
    const VAE_ALIGN = 16;
    const MAX_DUP_ATTEMPTS = 50;
    const FORM_STORAGE_KEY = 'z-image-form';
    let portraitPanel = 0;
    let touchStartY = 0;

    function snapDim(value) {
      const n = parseInt(value, 10) || 1024;
      return Math.max(VAE_ALIGN, Math.round(n / VAE_ALIGN) * VAE_ALIGN);
    }

    function snapSizeFields() {
      $('width').value = snapDim($('width').value);
      $('height').value = snapDim($('height').value);
    }

    function readFormState() {
      return {
        prompt: $('prompt').value,
        width: $('width').value,
        height: $('height').value,
        count: $('count').value,
      };
    }

    function saveFormState() {
      try {
        localStorage.setItem(FORM_STORAGE_KEY, JSON.stringify(readFormState()));
      } catch {
        // ignore quota / private mode
      }
    }

    function loadFormState() {
      try {
        const raw = localStorage.getItem(FORM_STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (typeof data.prompt === 'string') $('prompt').value = data.prompt;
        if (data.width != null) $('width').value = data.width;
        if (data.height != null) $('height').value = data.height;
        if (data.count != null) $('count').value = data.count;
      } catch {
        // ignore corrupt storage
      }
    }

    function canAbortQueue() {
      return generating && genProgress && genProgress.current < genProgress.total;
    }

    function canRefine() {
      return lastSeed != null && lastGenMode !== 'refined';
    }

    function canGenerate() {
      return lastGenMode === 'refined';
    }

    function secondaryMode() {
      return canRefine() ? 'refined' : 'generate';
    }

    function secondaryLabel() {
      return canRefine() ? 'Refine' : 'Generate';
    }

    function canSecondary() {
      return canRefine() || canGenerate();
    }

    function isSecondaryMode(mode) {
      return mode === 'refined' || mode === 'generate';
    }

    function updatePortraitLayout() {
      const portrait = window.innerHeight > window.innerWidth;
      document.body.classList.toggle('portrait', portrait);
      if (portrait) {
        syncPortraitPanel();
      }
      updateScrollJumpBtn();
    }

    function panelScrollTop(panel) {
      return window.scrollY + panel.getBoundingClientRect().top;
    }

    function scrollToPanel(index, { smooth = true } = {}) {
      if (!document.body.classList.contains('portrait')) {
        return;
      }
      portraitPanel = index;
      const panel = index === 0 ? $('form-panel') : $('gallery-panel');
      const top = Math.round(panelScrollTop(panel));
      window.scrollTo({ top, left: 0, behavior: smooth ? 'smooth' : 'auto' });
      updateScrollJumpBtn();
    }

    function scrollToForm() {
      scrollToPanel(0);
    }

    function scrollToGallery() {
      scrollToPanel(1);
    }

    function syncPortraitPanel() {
      if (!document.body.classList.contains('portrait')) {
        return;
      }
      const mid = window.scrollY + window.innerHeight * 0.35;
      const galleryTop = panelScrollTop($('gallery-panel'));
      portraitPanel = mid >= galleryTop ? 1 : 0;
    }

    function isOnGalleryPanel() {
      return portraitPanel === 1;
    }

    function onPortraitTouchStart(e) {
      if (!document.body.classList.contains('portrait')) {
        return;
      }
      touchStartY = e.touches[0].clientY;
    }

    function onPortraitTouchEnd(e) {
      if (!document.body.classList.contains('portrait')) {
        return;
      }
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dy) < 40) {
        return;
      }
      if (dy < 0 && portraitPanel === 0) {
        scrollToGallery();
      } else if (dy > 0 && portraitPanel === 1) {
        scrollToForm();
      }
    }

    function updateScrollJumpBtn() {
      const btn = $('scroll-jump-btn');
      if (!document.body.classList.contains('portrait')) {
        btn.classList.remove('visible');
        return;
      }
      btn.classList.add('visible');
      if (isOnGalleryPanel()) {
        btn.textContent = '↑';
        btn.setAttribute('aria-label', 'Scroll up');
      } else {
        btn.textContent = '↓';
        btn.setAttribute('aria-label', 'Scroll down');
      }
    }

    function onScrollJumpClick() {
      if (!document.body.classList.contains('portrait')) return;
      if (isOnGalleryPanel()) {
        scrollToForm();
      } else {
        scrollToGallery();
      }
    }

    function updateGenButton(btn, mode, label) {
      const spinner = btn.querySelector('.btn-spinner');
      const text = btn.querySelector('.btn-text');
      const isActive = generating && activeGenMode === mode;
      const abortable = canAbortQueue() && isActive;
      spinner.classList.toggle('hidden', !isActive || abortable);
      if (abortable) {
        text.textContent = genAbort ? 'Aborting…' : 'Abort';
      } else if (isActive && genProgress) {
        text.textContent = `${label} ${genProgress.current}/${genProgress.total}…`;
      } else if (isActive) {
        text.textContent = `${label}…`;
      } else {
        text.textContent = label;
      }
    }

    function updateSeedField() {
      $('seed').value = lastSeed != null ? String(lastSeed) : 'random';
    }

    function usesNextSeed(mode) {
      return mode === 'preview' || mode === 'generate';
    }

    function startSeedForMode(mode) {
      if (lastSeed == null) {
        return null;
      }
      if (usesNextSeed(mode)) {
        return lastSeed + 1;
      }
      if (mode === 'refined') {
        return lastSeed;
      }
      return null;
    }

    function applySeedToPayload(payload, { seed, seedBase }) {
      if (seed != null) {
        payload.seed = seed;
      }
      if (seedBase != null) {
        payload.seed_base = seedBase;
      }
    }

    function updateControls() {
      const workerBusy = generating;
      const abortable = canAbortQueue();
      const previewBtn = $('preview-btn');
      const refineBtn = $('refine-btn');
      const rightMode = secondaryMode();
      const rightLabel = secondaryLabel();

      if (generating) {
        previewBtn.disabled = activeGenMode !== 'preview' || !abortable;
        refineBtn.disabled = !isSecondaryMode(activeGenMode) || !abortable;
        if (abortable && isSecondaryMode(activeGenMode)) {
          refineBtn.disabled = false;
        }
      } else {
        previewBtn.disabled = false;
        refineBtn.disabled = !canSecondary();
      }

      updateGenButton(previewBtn, 'preview', 'Preview');
      const rightActiveMode = generating && isSecondaryMode(activeGenMode) ? activeGenMode : rightMode;
      updateGenButton(refineBtn, rightActiveMode, rightLabel);
      $('upload-btn').classList.toggle('is-busy', workerBusy);
      updateSeedField();
    }

    function setGenerating(on) {
      generating = on;
      updateControls();
    }

    function setStatus(msg, isError = false) {
      const el = $('status');
      el.textContent = msg || '';
      el.classList.toggle('is-error', Boolean(isError && msg));
    }

    function formatDate(ts) {
      return new Date(ts * 1000).toLocaleString();
    }

    function fileUrl(path) {
      return `/gallery/file?path=${encodeURIComponent(path)}`;
    }

    async function readPngParameters(blob) {
      const buf = new Uint8Array(await blob.arrayBuffer());
      const sig = [137, 80, 78, 71, 13, 10, 26, 10];
      if (buf.length < 8 || sig.some((b, i) => buf[i] !== b)) return null;
      const dec = new TextDecoder();
      let off = 8;
      while (off + 8 <= buf.length) {
        const len = (buf[off] << 24) | (buf[off + 1] << 16) | (buf[off + 2] << 8) | buf[off + 3];
        const type = dec.decode(buf.subarray(off + 4, off + 8));
        const data = buf.subarray(off + 8, off + 8 + len);
        if (type === 'tEXt') {
          const nul = data.indexOf(0);
          if (nul < 0) break;
          const key = dec.decode(data.subarray(0, nul));
          const val = dec.decode(data.subarray(nul + 1));
          if (key === 'parameters') return val;
        }
        off += 12 + len;
      }
      return null;
    }

    function parseGenMeta(raw) {
      if (!raw) return null;
      const promptEnd = raw.indexOf('Negative prompt:');
      const header = (promptEnd >= 0 ? raw.slice(0, promptEnd) : raw.split('\n')[0]).trimEnd();
      const headerLines = header.split('\n');
      const prompt = headerLines[0].trim();
      let template = null;
      for (let i = 1; i < headerLines.length; i++) {
        const line = headerLines[i];
        if (line.startsWith('Template:')) {
          template = line.slice('Template:'.length).trim();
          break;
        }
      }
      const info = promptEnd >= 0 ? raw.slice(promptEnd) : '';
      const field = (name) => {
        const m = info.match(new RegExp(`${name}:\\s*([^,\\n]+)`, 'i'));
        return m ? m[1].trim() : null;
      };
      const size = field('Size');
      let width = null;
      let height = null;
      if (size) {
        const [w, h] = size.split('x');
        width = parseInt(w, 10);
        height = parseInt(h, 10);
      }
      const seedVal = field('Seed');
      const stepsVal = field('Steps');
      return {
        prompt: prompt || null,
        template,
        width: Number.isFinite(width) ? width : null,
        height: Number.isFinite(height) ? height : null,
        seed: seedVal != null ? parseInt(seedVal, 10) : null,
        steps: stepsVal != null ? parseInt(stepsVal, 10) : null,
      };
    }

    function parseFilenameMeta(name) {
      const m = name.match(/-(\d+)x(\d+)-(\d+)(?:-s(\d+))?\.[a-z]+$/i);
      if (!m) return null;
      return {
        prompt: null,
        width: parseInt(m[1], 10),
        height: parseInt(m[2], 10),
        seed: parseInt(m[3], 10),
        steps: m[4] ? parseInt(m[4], 10) : REFINED_STEPS,
      };
    }

    function inferGenMode(steps) {
      if (steps === REFINED_STEPS) return 'refined';
      if (steps != null) return 'preview';
      return null;
    }

    function applyGenMeta(meta) {
      if (!meta || generating) return;
      if (meta.template || meta.prompt) {
        $('prompt').value = meta.template || meta.prompt;
      }
      if (meta.width) $('width').value = meta.width;
      if (meta.height) $('height').value = meta.height;
      snapSizeFields();
      if (meta.seed != null) {
        lastSeed = meta.seed;
        lastGenMode = inferGenMode(meta.steps);
      } else {
        lastSeed = null;
        lastGenMode = null;
      }
      updateControls();
    }

    async function extractMetaFromBlob(blob, filename) {
      let meta = null;
      if (filename.toLowerCase().endsWith('.png')) {
        meta = parseGenMeta(await readPngParameters(blob));
      }
      const fallback = parseFilenameMeta(filename);
      if (fallback) {
        meta = { ...fallback, ...meta, prompt: meta?.prompt ?? fallback.prompt };
      }
      return meta;
    }

    function imageSizeFromUrl(url) {
      return new Promise((resolve, reject) => {
        const probe = new Image();
        probe.onload = () => resolve({ width: probe.naturalWidth, height: probe.naturalHeight });
        probe.onerror = () => reject(new Error('Failed to read image size'));
        probe.src = url;
      });
    }

    function clearImageCache() {
      for (const entry of imageCache.values()) {
        URL.revokeObjectURL(entry.objectUrl);
      }
      imageCache.clear();
    }

    function updateViewerPrompt(meta) {
      const el = $('preview-prompt');
      if (meta?.template && meta.prompt) {
        el.textContent = meta.prompt;
        el.classList.remove('hidden');
      } else {
        el.textContent = '';
        el.classList.add('hidden');
      }
    }

    async function loadViewerImage(item) {
      const token = ++viewerToken;
      const img = $('preview');
      let cached = imageCache.get(item.path);

      if (!cached) {
        try {
          const res = await fetch(fileUrl(item.path));
          if (!res.ok) throw new Error('Failed to load image');
          const blob = await res.blob();
          if (token !== viewerToken) return;

          const meta = await extractMetaFromBlob(blob, item.name);
          cached = { objectUrl: URL.createObjectURL(blob), meta };
          imageCache.set(item.path, cached);
        } catch {
          if (token !== viewerToken) return;
          img.removeAttribute('src');
          return;
        }
      }

      if (token !== viewerToken) return;
      img.src = cached.objectUrl;
      applyGenMeta(cached.meta);
      updateViewerPrompt(cached.meta);
    }

    function updateViewer({ scrollGallery = false } = {}) {
      const img = $('preview');
      const empty = $('empty');
      const meta = $('preview-meta');
      const prompt = $('preview-prompt');
      const counter = $('counter');

      counter.classList.remove('hidden');

      if (!images.length) {
        viewerToken += 1;
        img.classList.add('hidden');
        img.removeAttribute('src');
        clearImageCache();
        empty.classList.remove('hidden');
        meta.textContent = '';
        prompt.textContent = '';
        prompt.classList.add('hidden');
        counter.textContent = '';
        return;
      }

      empty.classList.add('hidden');
      img.classList.remove('hidden');
      const item = images[index];
      img.alt = item.name;
      meta.textContent = `${item.name} · ${formatDate(item.created_at)}`;
      counter.textContent = `${index + 1} / ${images.length}`;
      loadViewerImage(item);
      if (scrollGallery) scrollToGallery();
    }

    function step(delta) {
      if (!images.length) return;
      index = (index + delta + images.length) % images.length;
      updateViewer({ scrollGallery: true });
    }

    function goFirst() {
      if (!images.length) return;
      index = 0;
      updateViewer({ scrollGallery: true });
    }

    function goLast() {
      if (!images.length) return;
      index = images.length - 1;
      updateViewer({ scrollGallery: true });
    }

    function isFormFieldFocused() {
      const el = document.activeElement;
      if (!el) return false;
      if (el.tagName === 'TEXTAREA') return true;
      if (el.tagName === 'INPUT') {
        const type = el.type;
        return type === 'text' || type === 'number' || type === 'search' || type === '';
      }
      return false;
    }

    function hasShortcutModifier(e) {
      return e.ctrlKey || e.metaKey || e.altKey || e.shiftKey;
    }

    function isSubmitChord(e) {
      return e.key === 'Enter' && (e.ctrlKey || e.metaKey || e.altKey);
    }

    async function submitGeneration() {
      if (generating) {
        return;
      }
      if (canRefine()) {
        await runGeneration('refined');
      } else {
        await runGeneration('preview');
      }
    }

    function focusImage(path, { scrollGallery = true } = {}) {
      const existing = images.findIndex((item) => item.path === path);
      if (existing >= 0) {
        index = existing;
      } else {
        images.unshift({
          name: path.split('/').pop(),
          path,
          created_at: Date.now() / 1000,
          size: 0,
        });
        index = 0;
      }
      updateViewer({ scrollGallery });
    }

    async function loadGallery({ keepPath, scrollGallery = false } = {}) {
      const focused = keepPath ?? (images[index]?.path ?? null);
      const res = await fetch('/gallery?recursive=1');
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to load gallery');
      images = data.images || [];
      if (focused) {
        const idx = images.findIndex((item) => item.path === focused);
        index = idx >= 0 ? idx : 0;
      } else if (index >= images.length) {
        index = 0;
      }
      updateViewer({ scrollGallery });
    }

    async function revealInGallery(path) {
      const stale = imageCache.get(path);
      if (stale) {
        URL.revokeObjectURL(stale.objectUrl);
        imageCache.delete(path);
      }
      await loadGallery({ keepPath: path });
      focusImage(path);
    }

    async function generateOne(payload, { focus = true } = {}) {
      const res = await fetch('/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Generation failed');
      if (focus && data.gallery_path) {
        await revealInGallery(data.gallery_path);
      }
      return data;
    }

    function modeLabel(mode) {
      if (mode === 'preview') return 'Preview';
      if (mode === 'refined') return 'Refine';
      return 'Generate';
    }

    async function runGeneration(mode) {
      if (generating) {
        if (canAbortQueue() && !genAbort && activeGenMode === mode) {
          genAbort = true;
          updateControls();
          setStatus(`Finishing ${genProgress.current} of ${genProgress.total}, then stopping…`);
        }
        return;
      }

      if (mode === 'refined' && !canRefine()) return;
      if (mode === 'generate' && !canGenerate()) return;

      const prompt = $('prompt').value.trim();
      if (!prompt) return;

      saveFormState();
      snapSizeFields();

      const count = mode === 'refined'
        ? 1
        : Math.max(1, Math.min(50, parseInt($('count').value, 10) || 1));
      const steps = mode === 'preview' ? PREVIEW_STEPS : REFINED_STEPS;
      const basePayload = {
        prompt,
        width: parseInt($('width').value, 10),
        height: parseInt($('height').value, 10),
        steps,
      };

      genAbort = false;
      activeGenMode = mode;
      setGenerating(true);
      genProgress = count > 1 ? { current: 0, total: count } : null;
      const label = modeLabel(mode);
      setStatus('');
      try {
        let last = null;
        let done = 0;
        let nextSeed = startSeedForMode(mode);
        const batchSeedBase = count > 1 && nextSeed != null ? nextSeed : null;
        let randomBatchBase = null;
        let openedExisting = false;

        for (let i = 0; i < count; i++) {
          if (i > 0 && genAbort) {
            break;
          }
          if (genProgress) {
            genProgress.current = i + 1;
            updateControls();
            setStatus(`${label} ${i + 1} of ${count}…`);
          }

          let slotDone = false;
          for (let attempt = 0; attempt < MAX_DUP_ATTEMPTS; attempt++) {
            const payload = { ...basePayload };
            let trySeed = nextSeed;
            if (trySeed == null && i > 0 && randomBatchBase != null) {
              trySeed = randomBatchBase + i;
            }
            applySeedToPayload(payload, {
              seed: trySeed,
              seedBase: batchSeedBase ?? (i > 0 ? randomBatchBase : null),
            });

            last = await generateOne(payload, { focus: false });

            if (mode === 'refined') {
              if (last.gallery_path) {
                await revealInGallery(last.gallery_path);
              }
              openedExisting = Boolean(last.skipped);
              lastSeed = last.seed;
              nextSeed = last.seed + 1;
              slotDone = true;
              break;
            }

            if (last.skipped) {
              nextSeed = (trySeed ?? last.seed) + 1;
              continue;
            }

            if (last.gallery_path) {
              await revealInGallery(last.gallery_path);
            }
            lastSeed = last.seed;
            nextSeed = last.seed + 1;
            if (randomBatchBase == null && i === 0 && trySeed == null) {
              randomBatchBase = last.seed;
            }
            slotDone = true;
            break;
          }

          if (!slotDone) {
            throw new Error('Could not find an unused seed');
          }

          lastGenMode = mode === 'preview' ? 'preview' : 'refined';
          done = i + 1;
        }

        if (genAbort) {
          setStatus(`Stopped after ${done} of ${count} · seed ${last?.seed ?? '—'}`);
        } else if (openedExisting && count === 1) {
          setStatus(`Opened existing · seed ${last.seed}`);
        } else if (count > 1) {
          setStatus(`${label} done ${count} images · seed ${last.seed}`);
        } else {
          setStatus(`${label} done in ${last.elapsed_s}s · seed ${last.seed}`);
        }
        scrollToGallery();
      } catch (err) {
        setStatus(err.message, true);
      } finally {
        genAbort = false;
        genProgress = null;
        activeGenMode = null;
        setGenerating(false);
      }
    }

    function runSecondary() {
      runGeneration(secondaryMode());
    }

    async function onSubmit(e) {
      e.preventDefault();
      await submitGeneration();
    }

    async function onUpload(e) {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file || generating) return;

      const uploadBtn = $('upload-btn');
      uploadBtn.classList.add('is-busy');
      try {
        let meta = await extractMetaFromBlob(file, file.name);
        meta = meta || {};

        if (!meta.width || !meta.height) {
          const objectUrl = URL.createObjectURL(file);
          try {
            const dims = await imageSizeFromUrl(objectUrl);
            if (!meta.width) meta.width = dims.width;
            if (!meta.height) meta.height = dims.height;
          } finally {
            URL.revokeObjectURL(objectUrl);
          }
        }

        if (!meta.template && !meta.prompt) {
          setStatus('Captioning…');
          const capFd = new FormData();
          capFd.append('image', file);
          const capRes = await fetch('/caption/upload', { method: 'POST', body: capFd });
          const capData = await capRes.json();
          if (!capRes.ok) throw new Error(capData.error || 'Caption failed');
          meta.prompt = capData.caption;
          setStatus(capData.source === 'metadata' ? 'Loaded from image metadata' : 'Captioned from image');
        } else {
          setStatus('Loaded from image metadata');
        }

        applyGenMeta(meta);
      } catch (err) {
        setStatus(err.message, true);
      } finally {
        uploadBtn.classList.remove('is-busy');
      }
    }

    $('gen-form').addEventListener('submit', onSubmit);
    $('preview-btn').addEventListener('click', () => runGeneration('preview'));
    $('refine-btn').addEventListener('click', () => runSecondary());
    $('upload').addEventListener('change', onUpload);
    $('prev-btn').addEventListener('click', () => step(-1));
    $('next-btn').addEventListener('click', () => step(1));
    $('scroll-jump-btn').addEventListener('click', onScrollJumpClick);
    $('width').addEventListener('change', () => { snapSizeFields(); updatePortraitLayout(); });
    $('height').addEventListener('change', () => { snapSizeFields(); updatePortraitLayout(); });
    window.addEventListener('resize', updatePortraitLayout);
    window.addEventListener('scroll', () => {
      syncPortraitPanel();
      updateScrollJumpBtn();
    }, { passive: true });
    document.addEventListener('touchstart', onPortraitTouchStart, { passive: true });
    document.addEventListener('touchend', onPortraitTouchEnd, { passive: true });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'End' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        if (canSecondary()) {
          runSecondary();
        } else {
          runGeneration('preview');
        }
        return;
      }

      if (isSubmitChord(e)) {
        e.preventDefault();
        submitGeneration();
        return;
      }

      if (isFormFieldFocused()) return;
      if (hasShortcutModifier(e)) return;

      const key = e.key.toLowerCase();
      if (key === 'p') {
        e.preventDefault();
        runGeneration('preview');
      } else if (key === 'r' && canRefine()) {
        e.preventDefault();
        runGeneration('refined');
      } else if (key === 'g' && canGenerate()) {
        e.preventDefault();
        runGeneration('generate');
      } else if (e.key === 'Home') {
        e.preventDefault();
        goFirst();
      } else if (e.key === 'End') {
        e.preventDefault();
        goLast();
      } else if (document.body.classList.contains('portrait') && (e.key === 'ArrowUp' || e.key === 'PageUp')) {
        e.preventDefault();
        scrollToForm();
      } else if (document.body.classList.contains('portrait') && (e.key === 'ArrowDown' || e.key === 'PageDown')) {
        e.preventDefault();
        scrollToGallery();
      } else if (e.key === 'ArrowLeft') {
        step(-1);
      } else if (e.key === 'ArrowRight') {
        step(1);
      }
    });

    loadFormState();
    updatePortraitLayout();
    loadGallery().catch((err) => setStatus(err.message, true));
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>z-image</title>
  <style>
    html { box-sizing: border-box; }
    *, *::before, *::after { box-sizing: inherit; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: #0b0d12;
      color: #e8eaef;
      font-size: clamp(0.72rem, 0.55rem + 0.9vmin, 1rem);
      line-height: 1.35;
      overflow: hidden;
    }

    .shell {
      height: 100dvh;
      display: flex;
      flex-direction: row;
      gap: 0.75em;
      padding: 0.75em;
    }

    .panel {
      background: rgba(18, 22, 32, 0.92);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 1em;
      min-height: 0;
    }

    .form-panel {
      width: clamp(14em, 32vw, 24em);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      padding: 0.9em 1em;
      overflow: hidden;
    }

    .gallery-panel {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .title { font-size: 1.35em; font-weight: 600; letter-spacing: -0.02em; }
    .subtitle { font-size: 0.78em; color: rgba(255,255,255,0.45); margin-top: 0.2em; }
    .field-label {
      display: block;
      font-size: 0.72em;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.45);
      margin-bottom: 0.25em;
    }

    #gen-form {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 0.6em;
      margin-top: 0.65em;
      overflow-y: auto;
    }

    .field { display: block; }
    .hidden { display: none !important; }
    .field-grow { flex: 1 1 auto; min-height: 4.5em; display: flex; flex-direction: column; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55em; }

    #gen-form input:not([type="file"]),
    #gen-form textarea,
    #gen-form select {
      display: block;
      width: 100%;
      margin: 0;
      background: #0f131c;
      border: 1px solid rgba(255,255,255,0.08);
      color: #e8eaef;
      border-radius: 0.45em;
      font: inherit;
      line-height: 1.45;
      padding: 0.7em 0.9em;
    }

    #gen-form textarea {
      flex: 1 1 auto;
      min-height: 4.5em;
      resize: none;
    }

    #gen-form input:focus,
    #gen-form textarea:focus,
    #gen-form select:focus {
      outline: none;
      border-color: rgba(99, 132, 255, 0.55);
      box-shadow: 0 0 0 3px rgba(99, 132, 255, 0.12);
    }

    #gen-form input:not([type="file"]):disabled,
    #gen-form textarea:disabled,
    #gen-form select:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .upload-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.55em 0.7em;
      border-radius: 0.45em;
      border: 1px dashed rgba(255,255,255,0.22);
      background: #121826;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .upload-btn:hover { border-color: rgba(99, 132, 255, 0.5); background: #151d2e; }
    .upload-btn.is-busy { opacity: 0.55; cursor: not-allowed; pointer-events: none; }
    .upload-btn input { display: none; }

    .gen-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55em;
    }

    .btn-primary {
      width: 100%;
      border: 0;
      border-radius: 0.65em;
      padding: 0.6em 0.8em;
      font: inherit;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, #4f7cff, #6b5cff);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45em;
      cursor: pointer;
      transition: filter 0.15s;
    }

    .btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; filter: none; }

    .btn-spinner {
      width: 1em;
      height: 1em;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 9999px;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #status { font-size: 0.78em; color: rgba(255,255,255,0.4); min-height: 1.2em; }
    #status.is-error { color: #ff8a8a; }

    .gallery-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65em 1em;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.92em;
      color: rgba(255,255,255,0.6);
      flex-shrink: 0;
    }

    #counter { font-size: 0.85em; color: rgba(255,255,255,0.4); font-variant-numeric: tabular-nums; }

    .preview-stage {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 0.75em;
    }

    .preview-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5em;
      min-height: 0;
    }

    #preview {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 0.5em;
      box-shadow: 0 1.2em 2.5em rgba(0,0,0,0.45);
    }

    #empty { font-size: 0.92em; color: rgba(255,255,255,0.35); }
    #preview-meta {
      font-size: 0.78em;
      color: rgba(255,255,255,0.4);
      text-align: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 1.5em;
      flex-shrink: 0;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: clamp(2em, 4.5vmin, 2.6em);
      height: clamp(2em, 4.5vmin, 2.6em);
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
      color: #e8eaef;
      font-size: 1.2em;
      line-height: 1;
      cursor: pointer;
      z-index: 2;
    }

    .nav-btn:hover { background: rgba(0,0,0,0.65); }
    #prev-btn { left: 0.6em; }
    #next-btn { right: 0.6em; }

    @media (max-aspect-ratio: 10/11) {
      .shell { flex-direction: column; }
      .form-panel {
        width: 100%;
        flex: 0 0 auto;
        max-height: 44dvh;
      }
      .gallery-panel { flex: 1 1 0; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="panel form-panel">
      <div>
        <h1 class="title">z-image</h1>
        <p class="subtitle">Generate from the warm worker</p>
      </div>

      <form id="gen-form">
        <label class="field field-grow">
          <span class="field-label">Prompt</span>
          <textarea id="prompt" required placeholder="Describe the image…"></textarea>
        </label>

        <div class="grid-2">
          <label class="field">
            <span class="field-label">Width</span>
            <input id="width" type="number" min="256" max="4096" step="16" value="1024">
          </label>
          <label class="field">
            <span class="field-label">Height</span>
            <input id="height" type="number" min="256" max="4096" step="16" value="1024">
          </label>
        </div>

        <label class="field">
          <span class="field-label">Count</span>
          <input id="count" type="number" min="1" max="50" value="1">
        </label>

        <label class="field">
          <span class="field-label">LoRA</span>
          <input id="lora" type="text" placeholder="name.safetensors:1.0">
        </label>

        <div class="field">
          <span class="field-label">Image → prompt</span>
          <label id="upload-btn" class="upload-btn">
            <input id="upload" type="file" accept="image/*">
            <span id="upload-label">Choose image…</span>
          </label>
        </div>

        <div class="gen-actions">
          <button type="button" id="preview-btn" class="btn-primary">
            <span class="btn-spinner hidden" aria-hidden="true"></span>
            <span class="btn-text">Preview</span>
          </button>
          <button type="button" id="refine-btn" class="btn-primary" disabled>
            <span class="btn-spinner hidden" aria-hidden="true"></span>
            <span class="btn-text">Refine</span>
          </button>
        </div>
        <p id="status"></p>
      </form>
    </section>

    <section class="panel gallery-panel">
      <div class="gallery-header">
        <span>Gallery</span>
        <span id="counter"></span>
      </div>

      <div class="preview-stage">
        <button type="button" id="prev-btn" class="nav-btn" aria-label="Previous">‹</button>

        <div class="preview-wrap">
          <img id="preview" alt="" class="hidden">
          <p id="empty">No images in gallery yet</p>
          <p id="preview-meta"></p>
        </div>

        <button type="button" id="next-btn" class="nav-btn" aria-label="Next">›</button>
      </div>
    </section>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let images = [];
    let index = 0;
    let generating = false;
    let captioning = false;
    let genProgress = null;
    let genAbort = false;
    let lastSeed = null;
    let lastGenMode = null;
    let activeGenMode = null;

    const PREVIEW_STEPS = 3;
    const REFINED_STEPS = 8;
    const FORM_STORAGE_KEY = 'z-image-form';

    function readFormState() {
      return {
        prompt: $('prompt').value,
        width: $('width').value,
        height: $('height').value,
        count: $('count').value,
        lora: $('lora').value,
      };
    }

    function saveFormState() {
      try {
        localStorage.setItem(FORM_STORAGE_KEY, JSON.stringify(readFormState()));
      } catch {
        // ignore quota / private mode
      }
    }

    function loadFormState() {
      try {
        const raw = localStorage.getItem(FORM_STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (typeof data.prompt === 'string') $('prompt').value = data.prompt;
        if (data.width != null) $('width').value = data.width;
        if (data.height != null) $('height').value = data.height;
        if (data.count != null) $('count').value = data.count;
        if (typeof data.lora === 'string') $('lora').value = data.lora;
      } catch {
        // ignore corrupt storage
      }
    }

    function canAbortQueue() {
      return generating && genProgress && genProgress.current < genProgress.total;
    }

    function canRefine() {
      return lastSeed != null && lastGenMode !== 'refined';
    }

    function updateGenButton(btn, mode, label) {
      const spinner = btn.querySelector('.btn-spinner');
      const text = btn.querySelector('.btn-text');
      const isActive = generating && activeGenMode === mode;
      const abortable = canAbortQueue() && isActive;
      spinner.classList.toggle('hidden', !isActive || abortable);
      if (abortable) {
        text.textContent = genAbort ? 'Aborting…' : 'Abort';
      } else if (isActive && genProgress) {
        text.textContent = `${label} ${genProgress.current}/${genProgress.total}…`;
      } else if (isActive) {
        text.textContent = `${label}…`;
      } else {
        text.textContent = label;
      }
    }

    function updateControls() {
      const workerBusy = generating || captioning;
      const abortable = canAbortQueue();
      const previewBtn = $('preview-btn');
      const refineBtn = $('refine-btn');

      if (generating) {
        previewBtn.disabled = activeGenMode !== 'preview' || !abortable;
        refineBtn.disabled = activeGenMode !== 'refined' || !abortable;
      } else {
        previewBtn.disabled = false;
        refineBtn.disabled = !canRefine();
      }

      updateGenButton(previewBtn, 'preview', 'Preview');
      updateGenButton(refineBtn, 'refined', 'Refine');
      $('upload-btn').classList.toggle('is-busy', workerBusy);
      $('upload-label').textContent = captioning ? 'Captioning…' : 'Choose image…';
    }

    function setGenerating(on) {
      generating = on;
      updateControls();
    }

    function setCaptioning(on) {
      captioning = on;
      updateControls();
    }

    function setStatus(msg, isError = false) {
      const el = $('status');
      el.textContent = msg || '';
      el.classList.toggle('is-error', Boolean(isError && msg));
    }

    function formatDate(ts) {
      return new Date(ts * 1000).toLocaleString();
    }

    function fileUrl(path) {
      return `/gallery/file?path=${encodeURIComponent(path)}`;
    }

    function parseLoras(text) {
      const raw = text.trim();
      if (!raw) return [];
      return raw.split(',').map((part) => {
        const [name, strength] = part.trim().split(':');
        const file = name.endsWith('.safetensors') ? name : `${name}.safetensors`;
        return { file, strength: strength ? parseFloat(strength) : 1 };
      });
    }

    async function readPngPrompt(file) {
      const buf = new Uint8Array(await file.arrayBuffer());
      const sig = [137, 80, 78, 71, 13, 10, 26, 10];
      if (buf.length < 8 || sig.some((b, i) => buf[i] !== b)) return null;
      const dec = new TextDecoder();
      let off = 8;
      while (off + 8 <= buf.length) {
        const len = (buf[off] << 24) | (buf[off + 1] << 16) | (buf[off + 2] << 8) | buf[off + 3];
        const type = dec.decode(buf.subarray(off + 4, off + 8));
        const data = buf.subarray(off + 8, off + 8 + len);
        if (type === 'tEXt') {
          const nul = data.indexOf(0);
          if (nul < 0) break;
          const key = dec.decode(data.subarray(0, nul));
          const val = dec.decode(data.subarray(nul + 1));
          if (key === 'parameters') {
            return val.split('Negative prompt:')[0].trim() || null;
          }
        }
        off += 12 + len;
      }
      return null;
    }

    function updateViewer() {
      const img = $('preview');
      const empty = $('empty');
      const meta = $('preview-meta');
      const counter = $('counter');

      if (!images.length) {
        img.classList.add('hidden');
        img.removeAttribute('src');
        empty.classList.remove('hidden');
        meta.textContent = '';
        counter.textContent = '';
        return;
      }

      empty.classList.add('hidden');
      img.classList.remove('hidden');
      const item = images[index];
      img.src = fileUrl(item.path);
      img.alt = item.name;
      meta.textContent = `${item.name} · ${formatDate(item.created_at)}`;
      counter.textContent = `${index + 1} / ${images.length}`;
    }

    function step(delta) {
      if (!images.length) return;
      index = (index + delta + images.length) % images.length;
      updateViewer();
    }

    function focusImage(path) {
      const existing = images.findIndex((item) => item.path === path);
      if (existing >= 0) {
        index = existing;
      } else {
        images.unshift({
          name: path.split('/').pop(),
          path,
          created_at: Date.now() / 1000,
          size: 0,
        });
        index = 0;
      }
      updateViewer();
    }

    async function loadGallery({ keepPath } = {}) {
      const focused = keepPath ?? (images[index]?.path ?? null);
      const res = await fetch('/gallery?recursive=1');
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to load gallery');
      images = data.images || [];
      if (focused) {
        const idx = images.findIndex((item) => item.path === focused);
        index = idx >= 0 ? idx : 0;
      } else if (index >= images.length) {
        index = 0;
      }
      updateViewer();
    }

    async function generateOne(payload) {
      const res = await fetch('/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Generation failed');
      if (data.gallery_path) {
        focusImage(data.gallery_path);
      }
      loadGallery({ keepPath: data.gallery_path }).catch(() => {});
      return data;
    }

    async function runGeneration(mode) {
      if (captioning) return;

      if (generating) {
        if (canAbortQueue() && !genAbort && activeGenMode === mode) {
          genAbort = true;
          updateControls();
          setStatus(`Finishing ${genProgress.current} of ${genProgress.total}, then stopping…`);
        }
        return;
      }

      if (mode === 'refined' && !canRefine()) return;

      const prompt = $('prompt').value.trim();
      if (!prompt) return;

      saveFormState();

      const count = Math.max(1, Math.min(50, parseInt($('count').value, 10) || 1));
      const loras = parseLoras($('lora').value);
      const steps = mode === 'preview' ? PREVIEW_STEPS : REFINED_STEPS;
      const basePayload = {
        prompt,
        width: parseInt($('width').value, 10),
        height: parseInt($('height').value, 10),
        steps,
      };
      if (loras.length) basePayload.loras = loras;

      genAbort = false;
      activeGenMode = mode;
      setGenerating(true);
      genProgress = count > 1 ? { current: 0, total: count } : null;
      const modeLabel = mode === 'preview' ? 'Preview' : 'Refine';
      setStatus('');
      try {
        let last = null;
        let done = 0;
        for (let i = 0; i < count; i++) {
          if (i > 0 && genAbort) {
            break;
          }
          if (genProgress) {
            genProgress.current = i + 1;
            updateControls();
            setStatus(`${modeLabel} ${i + 1} of ${count}…`);
          }
          const payload = { ...basePayload };
          if (mode === 'refined') {
            payload.seed = lastSeed + i;
          }
          last = await generateOne(payload);
          lastSeed = last.seed;
          lastGenMode = mode;
          done = i + 1;
        }
        if (genAbort) {
          setStatus(`Stopped after ${done} of ${count} · seed ${last?.seed ?? '—'}`);
        } else if (count > 1) {
          setStatus(`${modeLabel} done ${count} images · seed ${last.seed}`);
        } else {
          setStatus(`${modeLabel} done in ${last.elapsed_s}s · seed ${last.seed}`);
        }
      } catch (err) {
        setStatus(err.message, true);
      } finally {
        genAbort = false;
        genProgress = null;
        activeGenMode = null;
        setGenerating(false);
      }
    }

    async function onSubmit(e) {
      e.preventDefault();
      if (!generating) {
        await runGeneration('preview');
      }
    }

    async function onUpload(e) {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file || generating || captioning) return;

      try {
        const fromMeta = await readPngPrompt(file);
        if (fromMeta) {
          $('prompt').value = fromMeta;
          setStatus('Prompt loaded from PNG metadata');
          return;
        }

        setCaptioning(true);
        setStatus('Captioning…');
        const fd = new FormData();
        fd.append('image', file);
        const res = await fetch('/caption/upload', { method: 'POST', body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Caption failed');
        $('prompt').value = data.caption;
        setStatus(data.source === 'blip' ? `Captioned (${data.device})` : 'Prompt from metadata');
      } catch (err) {
        setStatus(err.message, true);
      } finally {
        if (captioning) setCaptioning(false);
      }
    }

    $('gen-form').addEventListener('submit', onSubmit);
    $('preview-btn').addEventListener('click', () => runGeneration('preview'));
    $('refine-btn').addEventListener('click', () => runGeneration('refined'));
    $('upload').addEventListener('change', onUpload);
    $('prev-btn').addEventListener('click', () => step(-1));
    $('next-btn').addEventListener('click', () => step(1));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') step(-1);
      if (e.key === 'ArrowRight') step(1);
    });

    loadFormState();
    loadGallery().catch((err) => setStatus(err.message, true));
  </script>
</body>
</html>
